name: pc-kernel
summary: Kernel plugin binary-repack sweep (core26/resolute)
description: Repack resolute generic kernel debs to smoke-test the kernel plugin.

grade: stable
build-base: core26
confinement: strict
type: kernel
version: "1"

parts:
  kernel:
    plugin: kernel
    source: .
    source-type: local
    kernel-build-config:
      build-type: binary-repack
      ubuntu-kernel-flavour: generic
      ubuntu-release-name: resolute
