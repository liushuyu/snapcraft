name: pc-kernel
summary: Initrd plugin test
description: A pc kernel to test the initrd plugin.

grade: stable
build-base: core22
confinement: strict
type: kernel
adopt-info: kernel

parts:
  kernel:
    plugin: kernel
    source: .
    source-type: local
    kernel-build-config:
      build-type: binary-repack
      ubuntu-kernel-flavour: generic
    stage-packages:
      - wireless-regdb
    override-build: |
      craftctl default

      kver="$(basename "${CRAFT_PART_INSTALL}/lib/modules/"*)"

      craftctl set version="${kver}"
    prime:
      - -kernel.img*

  initrd:
    after: [kernel]
    plugin: initrd
    initrd-config:
      image-type: efi
      build-backend: u-c-i
      firmware:
        - $CRAFT_STAGE/firmware/regulatory.db
        - $CRAFT_STAGE/firmware/regulatory.db.p7s
