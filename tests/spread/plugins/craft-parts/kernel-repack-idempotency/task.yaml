summary: Kernel plugin binary-repack rebuild without cleaning (manual)
manual: true
kill-timeout: 60m

systems:
  - ubuntu-24.04*

environment:
  SNAPCRAFT_BUILD_ENVIRONMENT: host
  SNAPCRAFT_ENABLE_EXPERIMENTAL_PLUGINS: 1

prepare: |
  #shellcheck source=tests/spread/tools/kernel-snap.sh
  . "$TOOLS_DIR/kernel-snap.sh"
  save_kernel_host_state

execute: |
  #shellcheck source=tests/spread/tools/kernel-snap.sh
  . "$TOOLS_DIR/kernel-snap.sh"

  snapcraft pack
  unsquashfs -d parts/first pc-kernel_*.snap
  verify_kernel_snap_firmware_if_required parts/first

  rm -f ./*.snap
  # Updating a local source reruns the build step without cleaning the part.
  touch snapcraft.yaml
  # The build template must remove generated outputs left by the first run.
  touch parts/kernel/build/kernel/unpacked-linux-image/boot/vmlinuz-stale
  snapcraft pack
  unsquashfs -d parts/second pc-kernel_*.snap
  verify_kernel_snap_firmware_if_required parts/second

  rm -f parts/first/snap/manifest.yaml parts/second/snap/manifest.yaml
  diff -qr parts/first parts/second

restore: |
  #shellcheck source=tests/spread/tools/kernel-snap.sh
  . "$TOOLS_DIR/kernel-snap.sh"

  rm -rf ./*.snap parts/first/ parts/second/
  snapcraft clean
  restore_kernel_host_state
