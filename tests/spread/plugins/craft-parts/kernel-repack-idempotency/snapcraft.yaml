name: pc-kernel
summary: Kernel plugin repack idempotency test
description: Verify repeated binary-repacks produce equal content trees.

grade: stable
build-base: core24
confinement: strict
type: kernel
version: "1"

parts:
  kernel:
    plugin: kernel
    source: .
    source-type: local
    kernel-build-config:
      build-type: binary-repack
      ubuntu-kernel-flavour: generic
      ubuntu-release-name: noble
