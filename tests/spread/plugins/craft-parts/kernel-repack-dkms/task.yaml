summary: Kernel plugin binary-repack DKMS extra modules (manual)
manual: true
kill-timeout: 60m

systems:
  - ubuntu-24.04*

environment:
  SNAPCRAFT_BUILD_ENVIRONMENT: host
  SNAPCRAFT_ENABLE_EXPERIMENTAL_PLUGINS: 1

prepare: |
  #shellcheck source=tests/spread/tools/kernel-snap.sh
  . "$TOOLS_DIR/kernel-snap.sh"
  save_kernel_host_state

  cp snapcraft.yaml.in snapcraft.yaml

execute: |
  #shellcheck source=tests/spread/tools/kernel-snap.sh
  . "$TOOLS_DIR/kernel-snap.sh"

  snapcraft pack
  verify_kernel_snap generic
  find squashfs-root/modules -path '*/updates/dkms/matrix_dkms.ko' -print -quit | grep -q .
  find squashfs-root/modules -path '*/updates/dkms/matrix_plain.ko' -print -quit | grep -q .
  grep -q matrix_dkms squashfs-root/modules/*/modules.dep

restore: |
  #shellcheck source=tests/spread/tools/kernel-snap.sh
  . "$TOOLS_DIR/kernel-snap.sh"

  if [ -e snapcraft.yaml ]; then
    snapcraft clean
  fi
  rm -rf ./*.snap squashfs-root/ snapcraft.yaml kernel-abi
  restore_kernel_host_state
